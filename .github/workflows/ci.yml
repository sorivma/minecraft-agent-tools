name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Standalone / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install build and adapter JDKs
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: |
            8
            21
      - name: Set up Gradle and validate the wrapper
        uses: gradle/actions/setup-gradle@da187c8e6ffbd3802e00f2477aa5a822b25f2dda # v4.4.4
      - name: Build, test, format-check and verify packaging
        shell: bash
        run: ./gradlew --no-daemon --console=plain build :mcp-server:installDist
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            core/*/build/reports/tests/
            tools/*/build/reports/tests/
            adapters/*/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14

  integrations:
    name: Harness integrations
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: |
            8
            21
      - uses: gradle/actions/setup-gradle@da187c8e6ffbd3802e00f2477aa5a822b25f2dda # v4.4.4
      - name: Fetch and verify the released Harness API
        id: harness
        env:
          GH_TOKEN: ${{ secrets.ECOSYSTEM_TOKEN || github.token }}
        run: python3 scripts/fetch-harness.py
      - name: Build every artifact and test the optional widgets
        env:
          HARNESS_API: ${{ steps.harness.outputs.jar }}
        run: ./gradlew --no-daemon --console=plain "-PharnessApiJar=$HARNESS_API" releaseChecksums
      - name: Upload complete release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate
          path: build/release/
          if-no-files-found: error
          retention-days: 14
      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-test-reports
          path: integrations/*/*/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14
