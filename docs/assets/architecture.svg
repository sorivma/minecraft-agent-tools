<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Agent to world: a block-by-block architecture</title>
  <desc id="desc">An MCP client connects by HTTP to a Java 8 MCP host and removable providers inside Minecraft's JVM. Internal authenticated bridges queue work and validate scope on the game thread. The endpoint ends with Minecraft.</desc>
  <defs>
    <pattern id="dirt" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="#684630"/>
      <path d="M0 0h12v6H0zM20 15h12v7H20z" fill="#80573b"/>
      <path d="M4 19h8v6H4zM24 2h8v7H24z" fill="#493629"/>
      <path d="M12 8h7v5h-7zM0 29h5v3H0z" fill="#947052"/>
    </pattern>
    <pattern id="stone" width="32" height="24" patternUnits="userSpaceOnUse">
      <rect width="32" height="24" fill="#58616a"/>
      <path d="M2 2h15v6H2zM19 12h11v7H19z" fill="#6c7680"/>
      <path d="M0 18h13v4H0zM22 2h10v4H22z" fill="#424c56"/>
    </pattern>
    <g id="plugin">
      <path d="M0 12L24 0L48 12L24 24Z" fill="#b9c2c2"/>
      <path d="M0 12L24 24V52L0 40Z" fill="#747f83"/>
      <path d="M24 24L48 12V40L24 52Z" fill="#4d5d67"/>
      <path d="M6 20L18 26V34L6 28Z" fill="#ecc068"/>
      <path d="M29 28L42 22V29L29 35Z" fill="#283942"/>
    </g>
    <g id="grass">
      <path d="M0 16L32 0L64 16L32 32Z" fill="#86af4f"/>
      <path d="M0 16L32 32V64L0 48Z" fill="#805437"/>
      <path d="M32 32L64 16V48L32 64Z" fill="#593d2c"/>
      <path d="M0 16L32 32V42L24 38V34L16 30V34L8 30V24L0 20Z" fill="#628e3c"/>
      <path d="M32 32L64 16V24L56 28V32L48 36V32L40 36V42L32 46Z" fill="#467637"/>
    </g>
  </defs>
  <rect width="1200" height="480" fill="#171e27"/>
  <g fill="#2d3a46" shape-rendering="crispEdges">
    <path d="M0 214h32v-32h32v16h48v-48h32v48h64v16h32v66H0z"/>
    <path d="M946 230v-32h48v-48h32v32h48v-64h32v64h48v32h46v66H946z"/>
    <path d="M338 242v-32h32v-16h48v32h32v54H338z"/>
  </g>
  <g fill="#697782" shape-rendering="crispEdges">
    <path d="M48 38h4v4h-4zM348 109h4v4h-4zM1138 40h4v4h-4zM762 80h4v4h-4zM816 265h4v4h-4z"/>
    <path d="M264 69h4v12h-4zM260 73h12v4h-12z" fill="#acb9b5"/>
  </g>
  <g font-family="Consolas, 'Liberation Mono', monospace">
    <text x="40" y="40" fill="#c1c9b9" font-size="13" letter-spacing="2">AGENT → BRIDGE → WORLD</text>
    <text x="1160" y="40" text-anchor="end" fill="#7f928c" font-size="12">FORGE 1.7.10</text>
    <text x="68" y="96" fill="#a6c779" font-size="16" font-weight="700">01 / MCP CLIENT</text>
    <text x="452" y="96" fill="#edbf68" font-size="16" font-weight="700">02 / JAVA 8 HOST</text>
    <text x="890" y="96" fill="#a6c779" font-size="16" font-weight="700">03 / JAVA 8</text>
  </g>
  <!-- Redstone paths cross process boundaries; square steps replace UI arrows. -->
  <g fill="none" stroke-linecap="square" shape-rendering="crispEdges">
    <path d="M226 233H292V218H434" stroke="#502c2b" stroke-width="14"/>
    <path d="M226 229H292V214H434" stroke="#d86446" stroke-width="6"/>
    <path d="M411 198L427 214L411 230" stroke="#f5a368" stroke-width="4"/>
    <path d="M683 232H735V215H878" stroke="#502c2b" stroke-width="14"/>
    <path d="M683 228H735V211H878" stroke="#d86446" stroke-width="6"/>
    <path d="M855 195L871 211L855 227" stroke="#f5a368" stroke-width="4"/>
  </g>
  <g font-family="Consolas, 'Liberation Mono', monospace" font-size="13" text-anchor="middle">
    <text x="335" y="176" fill="#e6d6b6">MCP / HTTP</text>
    <text x="773" y="160" fill="#e6d6b6">loopback TCP</text>
    <text x="773" y="180" fill="#d49a69">+ private token</text>
  </g>
