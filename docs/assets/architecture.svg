    <path d="M98 142H206V220H98Z" fill="#99a0a0"/>
    <path d="M106 150H198V212H106Z" fill="#343e46"/>
    <path d="M114 158H190V204H114Z" fill="#152f30"/>
    <path d="M130 169H138V177H130ZM138 177H146V185H138ZM130 185H138V193H130ZM155 189H176V193H155Z" fill="#b0d784"/>
    <path d="M142 220H166V231H180V236H128V231H142Z" fill="#6d777e"/>
    <path d="M206 142L222 152V226L206 220Z" fill="#56626b"/>
    <path d="M98 142L112 132H208L222 152L206 142Z" fill="#c0c3b6"/>
    <path d="M68 250h4v8h-4zM64 246h4v8h-4zM72 244h4v10h-4z" fill="#8eae55"/>
  </g>
  <!-- Island two: core machine and four removable provider cartridges. -->
  <g shape-rendering="crispEdges">
    <path d="M444 265H692V306H676V322H476V310H444Z" fill="url(#stone)"/>
    <path d="M444 258H692V267H444Z" fill="#8c9697"/>
    <path d="M455 139L511 113L567 139L511 165Z" fill="#a7afab"/>
    <path d="M455 139L511 165V236L455 210Z" fill="#727e83"/>
    <path d="M511 165L567 139V210L511 236Z" fill="#455762"/>
    <path d="M466 161L498 176V200L466 185Z" fill="#272e34"/>
    <path d="M474 171L490 179V187L474 179Z" fill="#f2bf65"/>
    <path d="M521 179L555 163V170L521 186ZM521 193L555 177V184L521 200ZM521 207L555 191V198L521 214Z" fill="#243b44"/>
    <path d="M479 139L511 125L543 139L511 153Z" fill="#74513b"/>
    <path d="M495 139L511 132L527 139L511 146Z" fill="#efb565"/>
    <use href="#plugin" x="580" y="156"/>
    <use href="#plugin" x="624" y="178"/>
    <use href="#plugin" x="536" y="208"/>
    <use href="#plugin" x="580" y="230"/>
  </g>
  <!-- Island three: actual game terrain and a queue of requests. -->
  <g shape-rendering="crispEdges">
    <path d="M886 265H1158V310H1134V326H918V310H886Z" fill="url(#dirt)"/>
    <path d="M886 258H1158V272H1142V280H1126V272H1062V279H1046V272H950V280H934V272H886Z" fill="#527b38"/>
    <path d="M886 258H1158V264H886Z" fill="#8eae55"/>
    <path d="M1106 174H1124V256H1106Z" fill="#755131"/>
    <path d="M1111 180H1117V252H1111Z" fill="#9b713d"/>
    <path d="M1078 134H1146V146H1162V182H1146V194H1086V182H1070V150H1078Z" fill="#355e36"/>
    <path d="M1078 134H1146V146H1130V158H1106V150H1070V142H1078Z" fill="#73984c"/>
    <path d="M1086 158H1102V170H1086ZM1122 174H1138V186H1122ZM1142 150H1158V162H1142Z" fill="#547e40"/>
    <use href="#grass" x="1004" y="206"/>
    <path d="M893 206H973V246H893Z" fill="#39454c"/>
    <path d="M897 210H917V242H897ZM923 210H943V242H923ZM949 210H969V242H949Z" fill="#79867f"/>
    <path d="M901 215H913V225H901ZM927 215H939V225H927ZM953 215H965V225H953Z" fill="#b5d17d"/>
    <path d="M973 223H993V219L1001 227L993 235V231H973Z" fill="#dfc68e"/>
    <path d="M1080 250h4v8h-4zM1076 246h4v8h-4zM1084 244h4v10h-4z" fill="#8eae55"/>
  </g>
  <g font-family="Consolas, 'Liberation Mono', monospace">
    <g fill="#f0e9d6" font-size="20" font-weight="700">
      <text x="48" y="363">Your agent</text>
      <text x="444" y="363">Core + plugin JARs</text>
      <text x="886" y="363">Game adapter</text>
    </g>
    <g fill="#aab3af" font-size="13">
      <text x="48" y="389">Chooses and calls tools</text>
      <text x="48" y="411">Receives structured context</text>
      <text x="444" y="389">Discover → validate → route</text>
      <text x="444" y="411">Inside Minecraft's JVM</text>
      <text x="886" y="389">Queue → scope check → tick</text>
      <text x="886" y="411">Server or client game thread</text>
    </g>
    <path d="M48 436H1158" stroke="#364038" stroke-width="2"/>
    <text x="48" y="460" fill="#7f928c" font-size="12">JAVA 8 CONTRACTS</text>
    <text x="444" y="460" fill="#7f928c" font-size="12">INDEPENDENT WORLD SESSIONS</text>
    <text x="886" y="460" fill="#7f928c" font-size="12">NO FORCED CHUNK LOADING</text>
  </g>
</svg>
